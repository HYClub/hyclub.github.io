name: Deploy to GitHub Pages

# 静态站点由 Actions 构建后发布到 Pages。
# 注意：Pages 本身不会执行构建，这里就是那个「构建环节」。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消正在排队的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 版本号从各项目自己的 tag / package.json / 源码常量抓，不手写。
      # 脚本内部已有重试与失败兜底（抓不到就沿用上一次的值），
      # 所以这里不加 continue-on-error —— 它挂了说明脚本自身有 bug。
      #
      # 私有仓库在 CI 里读不到（GITHUB_TOKEN 只覆盖本站仓库），
      # 那几项会沿用已提交的 versions.json。
      - name: Refresh project versions
        run: npm run versions
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
