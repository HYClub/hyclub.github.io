<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 · 页面不存在 · HYClub</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --accent: #4f8cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: #07090e;
        color: #e9edf5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        text-align: center;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
            58% 70% at 12% 0%,
            rgba(79, 140, 255, 0.22),
            transparent 68%
          ),
          radial-gradient(44% 56% at 88% 10%, rgba(160, 107, 255, 0.16), transparent 70%);
        pointer-events: none;
      }
      main {
        position: relative;
        max-width: 46ch;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        font-size: clamp(2.2rem, 7vw, 3.6rem);
        letter-spacing: -0.04em;
        margin: 14px 0 16px;
      }
      p {
        color: #99a3b7;
        line-height: 1.75;
        margin: 0 0 30px;
      }
      a {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 10px;
        border: 1px solid rgba(79, 140, 255, 0.5);
        background: rgba(79, 140, 255, 0.16);
        color: #9fc0ff;
        text-decoration: none;
        transition: background 0.2s ease, color 0.2s ease;
      }
      a:hover {
        background: rgba(79, 140, 255, 0.26);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404</div>
      <h1>这个页面不存在</h1>
      <p>
        链接可能已经改名或删掉了。回首页可以看到全部项目，以及四个能直接玩的演示。
      </p>
      <a href="/">← 回到项目列表</a>
    </main>
  </body>
</html>
